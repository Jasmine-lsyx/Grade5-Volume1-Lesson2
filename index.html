.run-grid{display:grid;grid-template-columns:minmax(350px,.85fr) minmax(520px,1.15fr);gap:18px}.run-list{display:grid;gap:7px}.run-line{padding:10px 12px;border-radius:10px;background:#f5f7fa;border:1px solid transparent;display:flex;gap:9px;color:#66758a}.run-line.current{background:var(--accent-soft);border-color:#b5ccf5;color:var(--accent);font-weight:800}.run-line.done{background:var(--good-soft);border-color:#cde8d7;color:var(--good)}.run-line.failed{background:var(--bad-soft);border-color:#efc8c8;color:var(--bad);font-weight:800}.assistant-stage{border:1px solid #dce5ef;border-radius:18px;background:linear-gradient(180deg,#f8fbff,#f2f7fc);padding:16px;min-height:420px}.assistant-top{display:flex;align-items:center;gap:12px}.assistant-face{font-size:48px}.bubble{padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #d9e4f1;line-height:1.7;flex:1}.mini-workbench{margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mini-zone{min-height:92px;border:1px solid #dce4ef;background:#fff;border-radius:14px;padding:10px;text-align:center}.mini-zone strong{display:block;margin-top:4px}.mini-cup{height:70px;width:58px;border:4px solid #7489a4;border-top-width:2px;border-radius:5px 5px 14px 14px;margin:4px auto;position:relative;overflow:hidden}.mini-water{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(83,177,240,.4)}.mini-fruit{position:absolute;left:4px;right:4px;bottom:7px;font-size:18px;z-index:2}.state-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.state-item{padding:10px;border-radius:11px;background:#fff;border:1px solid #e4e9f0}.state-item small{display:block;color:#7a8799;margin-bottom:3px}.state-item strong{font-size:14px}

<body>
<div class="app">
  <header class="topbar">
    <div class="topline">
      <div>
        <div class="eyebrow">五年级上册 · 第一单元「算法与算法表示」</div>
        <h1>第2课 自然语言描述算法</h1>
        <p class="challenge">主挑战：怎样让一个从没做过水果茶的人，只看你的文字也能完成？</p>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="teacherBtn">⚙ 教师模式</button>
      </div>
    </div>
    <div class="progress" id="progress"></div>
  </header>
  <div class="layout">
    <main class="main" id="main"></main>
    <aside class="side">
      <section class="panel">
        <h3 style="margin-bottom:12px">我的学习档案</h3>

(()=>{

const OPTIONS={
 clean:[{text:'把水果处理一下',vague:true},{text:'把水果洗一洗',ok:true},{text:'将水果清洗干净',ok:true}],
 slice:[{text:'把水果弄成小块',vague:true},{text:'把清洗好的水果切成片',ok:true},{text:'将水果切成薄片',ok:true}],
 put:[{text:'把它放进去',vague:true},{text:'把切好的水果放入杯中',ok:true},{text:'将水果片放进准备好的杯子里',ok:true}],

};

const DIAG=[
 {key:'clean',text:'把水果处理一下。',ok:false,type:'表达不明确',ask:'“处理一下”到底是清洗、切片，还是两件事都要做？我没法只靠这句话确定。',hint:'再看小助手的问题：它卡住，是因为不知道先后位置，还是因为根本不知道“处理一下”具体要做什么？'},
 {key:'put',text:'把水果放进杯中。',ok:false,type:'步骤不完整',ask:'我还没看到“清洗”和“切片”的清楚说明。是不是有关键动作没有写出来？',hint:'回到刚才亲手做水果茶的动作：从完整水果到放进杯中，中间有没有重要步骤没有被写出来？'},
 {key:'slice',text:'把水果切成片。',ok:false,type:'顺序不清楚',ask:'前一句已经让我把水果放进杯中了，现在才让我切片。我应该先放还是先切？',hint:'这里的动作并不是完全没写，而是出现的位置让执行者矛盾。再想想问题更像“缺了什么”，还是“先后摆错了”。'},
 {key:'water',text:'加一点水。',ok:false,type:'表达不明确',ask:'“一点”到底加到哪里停止？我需要一个能判断“做到位”的标准。',hint:'小助手知道要“加水”，但不知道什么时候停。问题在于步骤缺失、顺序，还是说法本身不够具体？'},
 {key:'soak',text:'泡一会儿。',ok:false,type:'表达不明确',ask:'“一会儿”什么时候结束？10秒、1分钟还是3分钟？',hint:'小助手知道要浸泡，却不知道何时结束。再判断：它缺的是一个动作，还是一个清楚的表达标准？'},
 {key:'finish',text:'浸泡结束后，水果茶制作完成。',ok:true,type:'',ask:'这句话告诉了我什么时候可以宣布完成。',hint:''}
];
const CLINIC=[
 {id:'c1',bad:'把水果处理一下。',q:'哪一种改法更容易让陌生执行者知道“具体做什么”？',opts:['把水果弄好。','将水果清洗干净，再切成片。','把水果看一看。'],ans:[1],good:'这句话把具体动作说出来了，执行者不用猜“处理”是什么意思。',badfb:'再想一想：你选的说法里，执行者能不能直接知道要做哪些动作？'},
 {id:'c2',bad:'加一点水。',q:'哪些说法能让执行者知道“加到什么程度”？（可能不止一个）',opts:['往杯中加入一杯水。','加水至水果基本浸没。','想加多少就加多少。'],ans:[0,1],good:'两种表达虽然不一样，但都给了执行者可以判断“什么时候停止加水”的依据。',badfb:'这里不只有一种合理表达。再比较：哪些说法能让执行者判断“什么时候停止”？'},
 {id:'c3',bad:'泡一会儿。',q:'哪一种说法让执行者更容易判断“什么时候结束”？',opts:['浸泡3分钟。','等等看。','差不多就行。'],ans:[0],good:'有了明确的结束条件，执行者就知道什么时候进入下一步。',badfb:'再想一想：如果只看到你选的这句话，执行者知道什么时候可以结束浸泡吗？'}
];
const STORAGE='g5_l2_natural_language_action_v3';
const fresh=()=>({
 stage:1,archive:[false,false,false,false,false,false],actionLog:[],actionSuccess:false,
 reviewOrder:DEFAULT_ORDER.slice(),
 diagIndex:0,diagSeen:[],diagnosticDone:false,diagPending:null,diagSelected:'',diagJudged:[],diagJudgeFeedback:'',diagJudgeFeedbackKind:'',
 clinic:{c1:[],c2:[],c3:[]},clinicChecked:{c1:false,c2:false,c3:false},clinicPassed:{c1:false,c2:false,c3:false},clinicDone:false,
 sentences:{clean:'',slice:'',put:'',water:'',soak:'',finish:''},pred:{},firstDraft:null,
 runCount:0,questionCount:0,repairCount:0,lastFailKey:'',reflection:[],completed:false
});
let state=load();let dragged=null;let work=null;let blind=null;let soakTimer=null;
const main=document.getElementById('main'),progress=document.getElementById('progress'),statusList=document.getElementById('statusList'),toastEl=document.getElementById('toast');
function load(){try{const r=localStorage.getItem(STORAGE);return r?Object.assign(fresh(),JSON.parse(r)):fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1600)}
function setStage(n){state.stage=Math.max(1,Math.min(7,n));save();renderAll();window.scrollTo({top:0,behavior:'smooth'})}
function renderAll(){renderProgress();renderArchive();renderStage()}
function renderProgress(){progress.innerHTML='';STAGES.forEach((s,i)=>{const n=i+1,d=document.createElement('div');d.className='pstep '+(n<state.stage?'done':n===state.stage?'active':'');d.textContent=(n<state.stage?'✓ ':'')+s;progress.appendChild(d)})}
function renderArchive(){statusList.innerHTML='';ARCH.forEach((t,i)=>{const d=document.createElement('div');d.className='status-item '+(state.archive[i]?'done':'');d.innerHTML=`<span class="dot">${state.archive[i]?'✓':i+1}</span><span>${t}</span>`;statusList.appendChild(d)})}
function renderStage(){if(state.stage===1)s1();else if(state.stage===2)s2();else if(state.stage===3)s3();else if(state.stage===4)s4();else if(state.stage===5)s5();else if(state.stage===6)s6();else s7()}
function chain(order){return `<div class="step-chain">${order.map((k,i)=>`${i?'<span class="arrow">→</span>':''}<span class="chip">${META[k].emoji} ${META[k].label}</span>`).join('')}</div>`}

/* Stage 1 */
function resetWork(){work={clean:false,slice:false,put:false,water:false,soak:false,finish:false,log:[],timer:0,animating:false};clearInterval(soakTimer)}
function s1(){if(!work)resetWork();main.innerHTML=`<section class="panel"><div class="task-badge">阶段1 · 先做一遍</div><h2>先别急着写，亲手做一杯水果茶</h2><p class="lead">把水果拖到合适的位置，完成清洗、切片、放入杯中、加水、浸泡和完成。你做过的每个动作，稍后都会变成自然语言算法中的一句话。</p><div class="lab-grid"><div class="workbench" id="workbench"><div class="bench-title">水果茶制作台</div><div class="zone" id="sinkZone" data-zone="sink"><div class="sink-icon">🚰</div>清洗区<small>把水果拖到这里</small><div class="process-layer wash-layer" id="washLayer"><div class="water-drops"><span>💧</span><span>💧</span><span>💧</span><span>💧</span></div><div class="wash-fruit">🍊🍋</div><div class="process-caption">正在冲洗水果……</div></div></div><div class="zone" id="boardZone" data-zone="board"><div class="board-icon">🔪</div>切片区<small>洗好的水果才能切</small><div class="process-layer cut-layer" id="cutLayer"><div class="cut-stage"><div class="cut-whole">🍊🍋</div><div class="knife-anim">🔪</div><div class="cut-slices" id="cutSlices"></div></div><div class="process-caption" id="cutCaption">正在把水果切成片……</div></div></div><div class="zone" id="cupZone" data-zone="cup"><div class="cup-visual"><div class="water-fill" id="waterFill"></div><div class="fruit-in-cup" id="fruitInCup"></div></div><div style="margin-top:6px">玻璃杯</div><small>把切好的水果放入杯中</small></div><div class="bench-surface"></div><div class="fruit-token" id="fruitToken" draggable="true" title="拖动水果"><div id="fruitMain">🍊🍋</div><small id="fruitState">完整水果</small></div><div class="kettle-token" id="kettleToken" draggable="true" title="拖到玻璃杯加水">🫖</div><div class="timer-box"><div class="hint">模拟浸泡</div><div class="timer-num" id="timerNum">0:00</div><div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div></div><div class="action-buttons"><button class="btn secondary" id="soakBtn">⏳ 开始浸泡</button><button class="btn primary" id="finishBtn">🍹 我觉得完成了</button><button class="btn ghost" id="resetWorkBtn">↺ 重新做一遍</button></div></div><div class="logbox"><h3>我的动作记录</h3><p class="hint">页面只记录你真正完成的动作。做错了也会记录，稍后可以回看为什么会卡住。</p><div class="log-list" id="actionLog"></div><div class="note" id="workFeedback" style="margin-top:12px">先把水果拖到清洗区。</div></div></div><div class="editor-actions"><button class="btn primary" id="toReview" ${work.finish?'':'disabled'}>完成制作，回看动作</button></div></section>`;bindWork();renderWork()}
function bindWork(){const fruit=document.getElementById('fruitToken'),kettle=document.getElementById('kettleToken');fruit.addEventListener('dragstart',e=>{if(work.animating||work.put){e.preventDefault();return}dragged='fruit'});kettle.addEventListener('dragstart',e=>{if(work.animating||work.water){e.preventDefault();return}dragged='kettle'});document.querySelectorAll('.zone').forEach(z=>{z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});z.addEventListener('dragleave',()=>z.classList.remove('over'));z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');dropOn(z.dataset.zone)})});fruit.onclick=()=>toast(work.slice?'现在拖动的是“切好的水果片”。':'把水果拖到“清洗区”“切片区”或“玻璃杯”。');kettle.onclick=()=>{if(work.put)doWater();else feedback('先想一想：杯中还没有准备好水果，现在就加水合适吗？','bad')};document.getElementById('soakBtn').onclick=startSoak;document.getElementById('finishBtn').onclick=doFinish;document.getElementById('resetWorkBtn').onclick=()=>{resetWork();s1()};document.getElementById('toReview').onclick=()=>{state.actionLog=work.log.slice();state.actionSuccess=true;state.archive[0]=true;save();setStage(2)}}
function dropOn(zone){const item=dragged;dragged=null;if(work.animating){feedback('当前动作还没有完成，请等动画结束后再进行下一步。','warn');return}if(item==='fruit'){if(zone==='sink')doClean();else if(zone==='board')doSlice();else if(zone==='cup')doPut()}else if(item==='kettle'&&zone==='cup')doWater()}
function addLog(text,ok=true){work.log.push({text,ok});renderWork()}
function feedback(t,kind=''){const el=document.getElementById('workFeedback');if(!el)return;el.className='note '+kind;el.innerHTML=t}
function sliceMarkup(cls=''){return `<div class="fruit-slices ${cls}"><span class="fruit-slice orange"></span><span class="fruit-slice lemon"></span><span class="fruit-slice orange"></span><span class="fruit-slice lemon"></span></div>`}
function doClean(){if(work.clean){feedback('水果已经清洗过了，可以继续下一步。','warn');return}const w=work,layer=document.getElementById('washLayer');work.animating=true;if(layer)layer.classList.add('active');feedback('正在清洗水果：观察水流冲过水果的过程。','warn');setTimeout(()=>{if(work!==w)return;work.animating=false;work.clean=true;if(layer)layer.classList.remove('active');addLog('清洗水果');feedback('水果已经洗干净。你可以看到水果状态已经变成“已清洗”。接下来还需要怎样处理？','good')},1500)}
function doSlice(){if(!work.clean){addLog('尝试切未清洗的水果',false);feedback('现在水果还没有清洗。真正制作时，你愿意先切再洗吗？请先完成清洗。','bad');return}if(work.slice){feedback('水果已经切成水果片了。','warn');return}const w=work,layer=document.getElementById('cutLayer'),slices=document.getElementById('cutSlices'),caption=document.getElementById('cutCaption');work.animating=true;if(slices)slices.innerHTML=sliceMarkup();if(layer){layer.classList.remove('sliced');layer.classList.add('active')}if(caption)caption.textContent='正在把水果切成片……';feedback('正在切片：观察完整水果怎样变成水果片。','warn');setTimeout(()=>{if(work!==w)return;if(layer)layer.classList.add('sliced');if(caption)caption.textContent='切片完成：现在是水果片';},900);setTimeout(()=>{if(work!==w)return;work.animating=false;work.slice=true;if(layer){layer.classList.remove('active','sliced')}addLog('把清洗好的水果切成片');feedback('切片完成。下方水果卡现在已经变成“水果片”，接下来可以把水果片放进杯中。','good')},1650)}
function doPut(){if(!work.slice){addLog('尝试把未切片的水果放进杯中',false);feedback('水果还是完整的。先把它处理成适合水果茶的形态，再放进杯中。','bad');return}if(work.put){feedback('水果片已经在杯中了。','warn');return}work.put=true;addLog('把切好的水果放入杯中');feedback('杯中现在显示的是切好的水果片，而不是完整水果。还需要什么才能浸泡？','good')}
function doWater(){if(!work.put){addLog('尝试在杯中没有水果时加水',false);feedback('玻璃杯里还没有水果。请先把水果准备好并放入杯中。','bad');return}if(work.water){feedback('已经加过水了。','warn');return}work.water=true;addLog('往杯中加水');feedback('水果片和水都准备好了。现在可以开始浸泡。','good')}
function startSoak(){if(work.soak){feedback('已经完成浸泡。','warn');return}if(!work.put||!work.water){addLog('尝试提前浸泡',false);feedback('浸泡前，杯中需要同时有水果和水。检查一下还缺什么。','bad');return}let t=0;document.getElementById('soakBtn').disabled=true;feedback('开始模拟浸泡：页面用几秒钟表示真实的几分钟。','warn');soakTimer=setInterval(()=>{t++;work.timer=t;const num=document.getElementById('timerNum'),fill=document.getElementById('timerFill');if(num)num.textContent=`0:0${Math.min(t,5)}`;if(fill)fill.style.width=(Math.min(t,5)*20)+'%';if(t>=5){clearInterval(soakTimer);work.soak=true;addLog('浸泡一段时间');feedback('浸泡完成。现在你可以判断任务是否完成。','good');renderWork()}},450)}
function doFinish(){if(!work.soak){addLog('尝试提前宣布完成',false);feedback('还没有完成浸泡。什么时候才能宣布“完成”？','bad');return}if(work.finish)return;work.finish=true;addLog('水果茶制作完成');feedback('成功！你刚才不是在“背步骤”，而是在真正执行一连串动作。','good');renderWork()}
function renderWork(){if(!document.getElementById('actionLog'))return;const fruit=document.getElementById('fruitToken'),fruitMain=document.getElementById('fruitMain'),fruitState=document.getElementById('fruitState');fruit.classList.toggle('done',work.put);document.getElementById('kettleToken').classList.toggle('done',work.water);if(fruitMain)fruitMain.innerHTML=work.slice?sliceMarkup('token'):'🍊🍋';if(fruitState)fruitState.textContent=work.slice?'已切成水果片':work.clean?'已清洗':'完整水果';document.getElementById('fruitInCup').innerHTML=work.put?sliceMarkup('cup'):'';document.getElementById('waterFill').style.height=work.water?'72%':'0';document.getElementById('timerNum').textContent=work.soak?'0:05':`0:0${Math.min(work.timer||0,5)}`;document.getElementById('timerFill').style.width=(work.soak?100:Math.min(work.timer||0,5)*20)+'%';const log=document.getElementById('actionLog');log.innerHTML=work.log.length?work.log.map((x,i)=>`<div class="log-item ${x.ok?'good':'bad'}"><strong>${i+1}</strong><span>${esc(x.text)}</span></div>`).join(''):'<div class="hint">还没有动作记录。</div>';const go=document.getElementById('toReview');if(go)go.disabled=!work.finish}

/* Stage 2 */
function s2(){const successful=state.actionLog.filter(x=>x.ok).map(x=>x.text);main.innerHTML=`<section class="panel"><div class="task-badge">阶段2 · 回看动作</div><h2>刚才“会做”的过程，能整理成几步？</h2><p class="lead">左边是你刚才的真实动作记录。右边把主要动作整理成算法1.0的步骤骨架。请用 ↑ ↓ 调整，直到它能清楚表示制作过程。</p><div class="review-grid"><div class="memory-card"><h3>我的真实动作记录</h3><div class="timeline">${successful.map((x,i)=>`<div class="timeline-item"><span class="n">${i+1}</span><span>${esc(x)}</span></div>`).join('')}</div>${state.actionLog.some(x=>!x.ok)?'<div class="note warn" style="margin-top:12px">你还出现过尝试失败的动作。这些“卡住”的时刻，正好帮助我们看清哪些动作有先后关系。</div>':''}</div><div class="sort-zone"><h3>整理成主要步骤</h3><div class="sort-list" id="sortList"></div><div class="note" id="sortFb" style="margin-top:12px">提示：这里的任务不是重新发明做法，而是把刚才的动作整理成清楚的步骤骨架。</div></div></div><div class="editor-actions"><button class="btn secondary" id="backDo">返回再做一遍</button><button class="btn primary" id="confirmOrder">确认步骤骨架</button></div></section>`;renderSort();document.getElementById('backDo').onclick=()=>setStage(1);document.getElementById('confirmOrder').onclick=()=>{if(!sameOrder(state.reviewOrder,DEFAULT_ORDER)){const fb=document.getElementById('sortFb');fb.className='note bad';fb.innerHTML='再检查一下：清洗和切片、浸泡和完成之间的先后关系是否合理？';return}state.archive[1]=true;save();setStage(3)}}
function renderSort(){const box=document.getElementById('sortList');box.innerHTML='';state.reviewOrder.forEach((k,i)=>{const d=document.createElement('div');d.className='sort-card';d.innerHTML=`<span class="num">${i+1}</span><span>${META[k].emoji} ${META[k].label}</span><span><button class="mini" data-up ${i===0?'disabled':''}>↑</button> <button class="mini" data-down ${i===state.reviewOrder.length-1?'disabled':''}>↓</button></span>`;d.querySelector('[data-up]').onclick=()=>moveReview(i,-1);d.querySelector('[data-down]').onclick=()=>moveReview(i,1);box.appendChild(d)})}
function moveReview(i,dir){const j=i+dir;if(j<0||j>=state.reviewOrder.length)return;[state.reviewOrder[i],state.reviewOrder[j]]=[state.reviewOrder[j],state.reviewOrder[i]];save();renderSort()}
function sameOrder(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}

/* Stage 3：第一次盲执行——执行不了时，先判断“为什么” */
function s3(){
  const done=state.diagnosticDone;
  const waiting=state.diagPending!==null && state.diagPending!==undefined;
  main.innerHTML=`<section class="panel">
    <div class="task-badge">阶段3 · 第一次盲执行</div>
    <h2>小助手真的能照着做吗？</h2>
    <p class="lead">先不要改说明。让执行者严格按文字理解：一旦它停下来，你先判断<b>为什么执行不了</b>，判断正确后再继续检查下一句。</p>
    <div class="run-grid">
      <div>
        <h3>一份水果茶说明</h3>
        <div class="run-list" id="diagList"></div>
        <div class="run-controls">
          <button class="btn primary" id="diagNext" ${done||waiting?'disabled':''}>${done?'检查完成':waiting?'先判断原因':'让小助手检查下一句'}</button>
          <button class="btn ghost" id="diagRestart">从头再检查</button>
        </div>
      </div>
      <div class="assistant-stage">
        <div class="assistant-top"><div class="assistant-face">🤖</div><div class="bubble" id="diagBubble">我会严格按文字理解，不替作者补充没写出来的意思。</div></div>
        <div class="note" id="diagFb" style="margin-top:12px">点击“检查下一句”，看看我会在哪里停下来。</div>

      </div>
    </div>
    <div id="diagDoneWrap"></div>
  </section>`;
  renderDiag();
  document.getElementById('diagNext').onclick=diagNext;
  document.getElementById('diagRestart').onclick=()=>{
    state.diagIndex=0;state.diagSeen=[];state.diagnosticDone=false;
    state.diagPending=null;state.diagSelected='';state.diagJudged=[];
    state.diagJudgeFeedback='';state.diagJudgeFeedbackKind='';state.archive[2]=false;
    save();s3();
  };
}
function renderDiag(){
  const list=document.getElementById('diagList');
  list.innerHTML=DIAG.map((d,i)=>{
    const seen=state.diagSeen.includes(i), pending=state.diagPending!==null&&state.diagPending!==undefined&&Number(state.diagPending)===i;
    const judged=state.diagJudged.includes(i), current=!state.diagnosticDone&&!pending&&i===state.diagIndex;
    let cls='';
    if(d.ok&&seen) cls='done';
    else if((!d.ok&&judged)||pending) cls='failed';
    else if(current) cls='current';
    return `<div class="run-line ${cls}"><strong>${i+1}</strong><span>${esc(d.text)}</span></div>`;
  }).join('');

  const confirmed=state.diagJudged.map(i=>({i,d:DIAG[i]})).filter(x=>x.d&&!x.d.ok);
  document.getElementById('issueList').innerHTML=confirmed.length
    ?confirmed.map((x,n)=>`<div class="timeline-item"><span class="n">${n+1}</span><span><span class="issue-type">${esc(x.d.type)}</span><br>${esc(x.d.ask)}</span></div>`).join('')
    :'<div class="hint">判断正确的问题会记录在这里。</div>';

  const bubble=document.getElementById('diagBubble'),fb=document.getElementById('diagFb'),judge=document.getElementById('diagJudgeArea');
  judge.innerHTML='';

  if(state.diagPending!==null && state.diagPending!==undefined){
    const d=DIAG[state.diagPending];
    bubble.innerHTML=`<b>我在第 ${state.diagPending+1} 句停下来了：</b><br>${esc(d.ask)}`;
    fb.className='note bad';fb.innerHTML='<b>现在轮到你判断：</b>是什么原因让我无法继续执行？';
    renderDiagJudge(state.diagPending);
  }else if(state.diagJudgeFeedback){
    fb.className='note '+(state.diagJudgeFeedbackKind||'');
    fb.innerHTML=state.diagJudgeFeedback;
    if(state.diagJudgeFeedbackKind==='good') bubble.textContent='你已经找到了我刚才卡住的原因，可以继续检查下一句。';
  }else if(state.diagSeen.length){
    const lastI=state.diagSeen[state.diagSeen.length-1],last=DIAG[lastI];
    if(last.ok){bubble.textContent='这句话我能直接照着理解。';fb.className='note good';fb.textContent='这一句比较清楚，我不用追问。';}
  }

  if(state.diagnosticDone){
    document.getElementById('diagDoneWrap').innerHTML=`<div class="concept" style="display:block;margin-top:16px"><h3>第一次盲执行告诉我们什么？</h3><p class="lead" style="margin-bottom:8px">小助手卡住的原因并不都一样：有时是关键步骤没写完整，有时是先后位置让人矛盾，有时是话本身说得不够明确。下一步进入“表达诊所”，专门练习怎样把这些问题改好。</p><div class="step-chain"><span class="chip">步骤完整</span><span class="chip">顺序清楚</span><span class="chip">表达明确</span></div><div class="editor-actions"><button class="btn primary" id="toClinic">进入表达诊所</button></div></div>`;
    document.getElementById('toClinic').onclick=()=>setStage(4);
  }
}
function renderDiagJudge(i){
  const area=document.getElementById('diagJudgeArea');
  if(!area)return;
  const choices=['步骤不完整','顺序不清楚','表达不明确'];
  area.innerHTML=`<div class="diag-judge">
    <h4>你觉得，是什么原因让小助手停下来了？</h4>
    <div class="diag-choices">${choices.map(c=>`<button class="diag-choice ${state.diagSelected===c?'sel':''}" data-reason="${c}">${c}</button>`).join('')}</div>
    <div class="diag-submit"><button class="btn secondary" id="diagSubmit" ${state.diagSelected?'':'disabled'}>提交判断</button></div>
    <div id="diagJudgeFb" class="${state.diagJudgeFeedback?'note '+(state.diagJudgeFeedbackKind||''):'hint'}" style="margin-top:10px">${state.diagJudgeFeedback||'先选择一种原因，再提交判断。'}</div>
  </div>`;
  area.querySelectorAll('[data-reason]').forEach(b=>b.onclick=()=>{
    state.diagSelected=b.dataset.reason;state.diagJudgeFeedback='';state.diagJudgeFeedbackKind='';save();renderDiag();
  });
  document.getElementById('diagSubmit').onclick=submitDiagJudge;
}
function submitDiagJudge(){
  if(state.diagPending===null||state.diagPending===undefined||!state.diagSelected)return;
  const i=Number(state.diagPending),d=DIAG[i];
  if(state.diagSelected===d.type){
    if(!state.diagJudged.includes(i))state.diagJudged.push(i);
    state.diagJudgeFeedback=`<b>✓ 你判断对了。</b> ${esc(diagReasonExplain(d.type,d))}`;
    state.diagJudgeFeedbackKind='good';
    state.diagPending=null;state.diagSelected='';state.diagIndex=i+1;
    if(state.diagIndex>=DIAG.length){state.diagnosticDone=true;state.archive[2]=true;}
    save();s3();
  }else{
    state.diagJudgeFeedback=`<b>再想一想。</b> ${esc(d.hint||'重新读一读小助手的问题，再判断它究竟卡在哪里。')}`;
    state.diagJudgeFeedbackKind='bad';
    save();renderDiag();
  }
}
function diagReasonExplain(type,d){
  if(type==='表达不明确')return '这句话虽然提到了动作，但执行者不知道具体该怎么做，或不知道做到什么程度。';
  if(type==='步骤不完整')return '关键动作没有完整写出来，执行者无法从当前状态顺利走到下一步。';
  if(type==='顺序不清楚')return '动作本身可能写到了，但出现的位置前后矛盾，执行者不知道究竟应该先做哪一步。';
  return d.ask||'你找到了执行者卡住的真正原因。';
}
function diagNext(){
  if(state.diagnosticDone||state.diagPending!==null&&state.diagPending!==undefined)return;
  const i=state.diagIndex;
  if(i>=DIAG.length)return;
  state.diagJudgeFeedback='';state.diagJudgeFeedbackKind='';state.diagSelected='';
  if(!state.diagSeen.includes(i))state.diagSeen.push(i);
  const d=DIAG[i];
  if(d.ok){
    state.diagIndex=i+1;
    if(state.diagIndex>=DIAG.length){state.diagnosticDone=true;state.archive[2]=true;}
  }else{
    state.diagPending=i;
  }
  save();s3();
}

function renderClinic(){

    document.getElementById('clinicNext').innerHTML='<div class="editor-actions"><button class="btn primary" id="toEditor">下一步：重新把动作说清楚</button></div>';

function checkClinic(c){

/* Stage 6：重新盲执行——这一次验证学生自己的新说明 */
function buildBlind(){blind={order:state.reviewOrder.slice(),sentences:{...state.sentences},index:0,done:[],failed:null,sim:{clean:false,slice:false,put:false,water:false,soak:false,finish:false}}}
function startFinalBlind(){buildBlind();state.runCount++;save();setStage(6)}
function s6(){

  main.innerHTML=`<section class="panel">
    <div class="task-badge">阶段6 · 重新盲执行</div>
    <h2>再验证一次：我的新说明能不能让小助手从头做到尾？</h2>
    <p class="lead">这一次执行的是你刚刚重新写好的6句话。哪里卡住，就回去改哪里；修改以后必须从头再验证。</p>
    <div class="run-grid"><div><h3>我的自然语言算法</h3><div class="run-list" id="runList"></div><div class="run-controls"><button class="btn primary" id="nextRun">执行下一句话</button><button class="btn secondary" id="autoRun">连续执行</button><button class="btn ghost" id="restartRun">从头再来</button></div></div>
      <div class="assistant-stage"><div class="assistant-top"><div class="assistant-face">🤖</div><div class="bubble" id="bubble">我准备好了。这一次，我只按你写的新说明执行。</div></div><div class="mini-workbench"><div class="mini-zone">水果<strong id="miniFruit">完整、未清洗</strong></div><div class="mini-zone"><div class="mini-cup"><div class="mini-water" id="miniWater"></div><div class="mini-fruit" id="miniFruitCup"></div></div><strong>玻璃杯</strong></div><div class="mini-zone">浸泡<strong id="miniSoak">未开始</strong></div></div><div class="state-grid" id="blindStates"></div><div class="note" id="runFb" style="margin-top:12px">从第1句话开始验证。</div></div></div>

function renderBlind(){
  const list=document.getElementById('runList');list.innerHTML='';
  blind.order.forEach((k,i)=>{const d=document.createElement('div');d.className='run-line '+(blind.done.includes(i)?'done':blind.failed&&blind.failed.i===i?'failed':i===blind.index?'current':'');d.innerHTML=`<strong>${i+1}</strong><span>${esc(blind.sentences[k])}</span>`;list.appendChild(d)});
  const s=blind.sim;document.getElementById('miniFruit').textContent=s.slice?'已清洗、已切片':s.clean?'已清洗、完整':'完整、未清洗';document.getElementById('miniWater').style.height=s.water?'72%':'0';document.getElementById('miniFruitCup').innerHTML=s.put?sliceMarkup('cup'):'';document.getElementById('miniSoak').textContent=s.soak?'已完成':'未开始';
  document.getElementById('blindStates').innerHTML=[['清洗',s.clean],['切片',s.slice],['入杯',s.put],['加水',s.water],['浸泡',s.soak],['完成',s.finish]].map(x=>`<div class="state-item"><small>${x[0]}</small><strong>${x[1]?'✓ 已完成':'— 未完成'}</strong></div>`).join('');
  const b=document.getElementById('nextRun');b.disabled=!!blind.failed||s.finish;document.getElementById('autoRun').disabled=!!blind.failed||s.finish;

    document.getElementById('repairBtn').onclick=()=>{state.lastFailKey=blind.failed.key;state.repairCount++;save();setStage(5)};
  }else if(s.finish){
    document.getElementById('bubble').innerHTML='我已经完全按照你的新说明，从头到尾完成了水果茶。';
    const fb=document.getElementById('runFb');fb.className='note good';fb.innerHTML='<b>重新验证通过！</b> 这一次执行者不需要替你猜，也不需要停下来追问。';
    if(!state.archive[5]){state.archive[5]=true;save();setTimeout(()=>setStage(7),900)}
  }

function classify(k,text){
  const t=(text||'').trim();if(!t)return{ok:false,type:'步骤不完整',ask:`这里没有写“${META[k].label}”这一步，我不知道该做什么。`};
  const vague=/(处理一下|弄成小块|放进去|加点|一点水|泡一会儿|差不多|弄好了|适量|若干)/;
  if(vague.test(t))return{ok:false,type:'表达不明确',ask:`“${t}”里还有需要我猜的地方。请告诉我“具体做什么、做到什么程度”。`};
  const must={clean:/洗|清洗/,slice:/切/,put:/杯|放入|放进/,water:/水/,soak:/泡|浸|静置/,finish:/完成|饮用|做好/};
  if(!must[k].test(t))return{ok:false,type:'表达不明确',ask:`我读到“${t}”，但还不能确定它是不是在告诉我“${META[k].label}”。`};
  return{ok:true};
}
function orderOk(k,s){if(k==='clean')return{ok:true};if(k==='slice'&&!s.clean)return{ok:false,ask:'水果还没有清洗，现在就切吗？请检查前后顺序。'};if(k==='put'&&!s.slice)return{ok:false,ask:'水果还没有切片，现在就放入杯中吗？'};if(k==='water'&&!s.put)return{ok:false,ask:'你的说明让我现在加水，但杯中还没有水果。请检查顺序。'};if(k==='soak'&&(!s.put||!s.water))return{ok:false,ask:'浸泡前，杯中需要同时有水果和水。'};if(k==='finish'&&!s.soak)return{ok:false,ask:'还没有完成浸泡，现在就宣布完成了吗？'};return{ok:true}}
function blindNext(){if(blind.failed||blind.index>=blind.order.length)return;const i=blind.index,k=blind.order[i],text=blind.sentences[k];const c=classify(k,text);if(!c.ok){blind.failed={i,key:k,type:c.type,ask:c.ask};state.questionCount++;save();renderBlind();return}const o=orderOk(k,blind.sim);if(!o.ok){blind.failed={i,key:k,type:'顺序不清楚',ask:o.ask};state.questionCount++;save();renderBlind();return}blind.sim[k]=true;blind.done.push(i);blind.index++;document.getElementById('bubble').textContent=`我听懂了：“${text}”`;renderBlind()}
function autoRun(){if(blind.failed||blind.sim.finish)return;blindNext();if(!blind.failed&&!blind.sim.finish)setTimeout(autoRun,500)}
function draftHtml(order,sentences,base){return order.map((k,i)=>`<div class="algo-line ${base&&base[k]!==sentences[k]?'diff':''}"><b>${i+1}.</b> ${esc(sentences[k]||'（未写）')}</div>`).join('')}

/* Stage 7：形成算法2.0 */
function s7(){
  const parts=['步骤完整','顺序清楚','表达明确','别人只看文字也能做'];
  const reflection=state.reflection.length?`我发现：自然语言描述算法时，要做到${state.reflection.map(x=>'“'+x+'”').join('、')}。`:'点击关键词，组成你今天的发现。';
  const diagProblems=state.diagSeen.filter(i=>!DIAG[i].ok).length;
  main.innerHTML=`<section class="panel print-panel"><div class="task-badge no-print">阶段7 · 形成算法2.0</div><h2 class="no-print">把“会做”真正变成“别人只看文字也能做”</h2><div class="summary-card">
    <div class="summary-head"><div><div class="eyebrow">第一单元 · 阶段成果</div><h2>《水果茶算法2.0——自然语言版》</h2></div><div class="version">版本 2.0</div></div>
    <div class="summary-section"><h3>算法1.0：步骤骨架</h3>${chain(state.reviewOrder)}</div>
    <div class="summary-section"><h3>第一次盲执行发现</h3><div class="reflection">小助手在粗略说明中记录了 ${diagProblems} 处需要追问的问题。我先进入“表达诊所”练习判断，再重新写完整算法。</div></div>
    ${state.firstDraft?`<div class="summary-section"><h3>我重新写出的第一版说明</h3>${draftHtml(state.firstDraft.order,state.firstDraft.sentences)}</div>`:''}
    <div class="summary-section"><h3>我的自然语言算法2.0</h3>${draftHtml(state.reviewOrder,state.sentences,state.firstDraft?state.firstDraft.sentences:null)}</div>
    <div class="summary-section"><h3>我的重新验证记录</h3><div class="reflection">重新盲执行 ${state.runCount} 次；小助手累计提出 ${state.questionCount} 个问题；我根据问题定位修改 ${state.repairCount} 次；最终从头到尾执行通过。</div></div>
    <div class="summary-section"><h3>三项出厂检查</h3><div class="step-chain"><span class="chip">✓ 步骤完整</span><span class="chip">✓ 顺序清楚</span><span class="chip">✓ 表达明确</span></div></div>
    <div class="summary-section no-print"><h3>把今天的发现组成一句话</h3><div class="phrase-builder">${parts.map(p=>`<button class="phrase-btn ${state.reflection.includes(p)?'sel':''}" data-p="${p}">${p}</button>`).join('')}</div><div class="reflection" id="reflectionText" style="margin-top:10px">${reflection}</div></div>
    <div class="summary-section"><h3>下一课</h3><div class="reflection">这份文字算法已经能被执行。下一课，我们把同一个算法换成流程图表示，让过程“一眼就能看清”。</div></div>
    <div class="summary-actions no-print"><button class="btn primary" id="printBtn">打印 / 保存为PDF</button><button class="btn secondary" id="backEditor">回看我的表达</button><button class="btn ghost" id="backClinic">回看表达诊所</button></div>
  </div></section>`;
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p,i=state.reflection.indexOf(p);if(i>=0)state.reflection.splice(i,1);else state.reflection.push(p);state.completed=true;save();s7()});
  document.getElementById('printBtn').onclick=()=>window.print();document.getElementById('backEditor').onclick=()=>setStage(5);document.getElementById('backClinic').onclick=()=>setStage(4);
}

/* Teacher */
const modal=document.getElementById('teacherModal');
document.getElementById('teacherBtn').onclick=()=>modal.classList.add('show');
document.getElementById('closeTeacher').onclick=()=>modal.classList.remove('show');
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
const jump=document.getElementById('jumpGrid');
STAGES.forEach((s,i)=>{const b=document.createElement('button');b.className='mini';b.textContent=`${i+1}. ${s}`;b.onclick=()=>{modal.classList.remove('show');teacherJump(i+1)};jump.appendChild(b)});
document.getElementById('resetBtn').onclick=()=>{if(!confirm('重置本课学习过程？'))return;state=fresh();work=null;blind=null;save();modal.classList.remove('show');renderAll()};
function teacherJump(n){
  if(n>=2){state.archive[0]=true;state.actionSuccess=true;state.actionLog=DEFAULT_ORDER.map(k=>({text:META[k].label,ok:true}))}
  if(n>=3){state.archive[1]=true;state.reviewOrder=DEFAULT_ORDER.slice()}
  if(n>=4){state.archive[2]=true;state.diagIndex=DIAG.length;state.diagSeen=DIAG.map((_,i)=>i);state.diagnosticDone=true}
  if(n>=5){state.archive[3]=true;state.clinic={c1:[1],c2:[0,1],c3:[0]};state.clinicChecked={c1:true,c2:true,c3:true};state.clinicPassed={c1:true,c2:true,c3:true};state.clinicDone=true}
  if(n>=6){state.archive[4]=true;DEFAULT_ORDER.forEach(k=>{if(!state.sentences[k])state.sentences[k]=OPTIONS[k].find(o=>o.ok).text});state.firstDraft=state.firstDraft||{order:DEFAULT_ORDER.slice(),sentences:{...state.sentences}};blind=null}
  if(n>=7){state.archive[5]=true;state.runCount=Math.max(1,state.runCount)}
  state.stage=n;save();renderAll();
}
renderAll();
})();
</script>
